<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VRM 1.0 Debugger - Full Arm & Fingers</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        #info { position: absolute; top: 10px; left: 10px; color: #00ff00; font-family: monospace; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>
    <div id="info">Loading: Sendagaya_Shibu.vrm ...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20.0);
        camera.position.set(0, 1.4, 1.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.3, 0);
        controls.update();

        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(1, 2, 1);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        let currentVrm = null;
        const boneState = {};
        const boneNames = [
            'head', 'hips',
            'leftUpperArm', 'leftLowerArm', 'leftHand',
            'rightUpperArm', 'rightLowerArm', 'rightHand'
        ];

        const fingerNames = ['Thumb', 'Index', 'Middle', 'Ring', 'Little'];
        const fingerSegments = ['Proximal', 'Intermediate', 'Distal'];
        
        ['left', 'right'].forEach(side => {
            fingerNames.forEach(finger => {
                fingerSegments.forEach(seg => {
                    const name = side + finger + seg;
                    boneNames.push(name);
                });
            });
        });
        boneNames.forEach(name => {
            boneState[name] = { x: 0, y: 0, z: 0 };
        });

        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));

        loader.load(
            './Sendagaya_Shibu.vrm',
            (gltf) => {
                const vrm = gltf.userData.vrm;
                currentVrm = vrm;
                VRMUtils.rotateVRM0(vrm);
                scene.add(vrm.scene);
                document.getElementById('info').innerText = "Model Loaded. Expand folders to move joints!";
                initGUI(vrm);
            }
        );

        function initGUI(vrm) {
            const gui = new GUI();
            const bodyFolder = gui.addFolder('Body & Arms');
            ['head', 'hips', 'leftUpperArm', 'leftLowerArm', 'rightUpperArm', 'rightLowerArm'].forEach(name => {
                const folder = bodyFolder.addFolder(name);
                folder.add(boneState[name], 'x', -180, 180);
                folder.add(boneState[name], 'y', -180, 180);
                folder.add(boneState[name], 'z', -180, 180);
                folder.close();
            });

            const leftHandFolder = gui.addFolder('Left Hand & Fingers');
            createFingerGUI(leftHandFolder, 'left');

            const rightHandFolder = gui.addFolder('Right Hand & Fingers');
            createFingerGUI(rightHandFolder, 'right');

            if (vrm.expressionManager) {
                const expFolder = gui.addFolder('Expressions');
                vrm.expressionManager.expressions.forEach(exp => {
                    const obj = { weight: 0 };
                    expFolder.add(obj, 'weight', 0, 1).name(exp.expressionName).onChange(val => {
                        vrm.expressionManager.setValue(exp.expressionName, val);
                    });
                });
            }
        }

        function createFingerGUI(parentFolder, side) {
            const handName = side + 'Hand';
            const handFolder = parentFolder.addFolder('Hand (Wrist)');
            handFolder.add(boneState[handName], 'x', -180, 180);
            handFolder.add(boneState[handName], 'y', -180, 180);
            handFolder.add(boneState[handName], 'z', -180, 180);

            fingerNames.forEach(fName => {
                const fFolder = parentFolder.addFolder(fName);
                fingerSegments.forEach(sName => {
                    const boneKey = side + fName + sName;
                    const sFolder = fFolder.addFolder(sName);
                    sFolder.add(boneState[boneKey], 'x', -180, 180);
                    sFolder.add(boneState[boneKey], 'y', -180, 180);
                    sFolder.add(boneState[boneKey], 'z', -180, 180);
                    sFolder.close();
                });
                fFolder.close();
            });
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (currentVrm) {
                currentVrm.update(delta);
                Object.keys(boneState).forEach(key => {
                    const node = currentVrm.humanoid.getBoneNode(key);
                    if (node) {
                        node.rotation.set(
                            THREE.MathUtils.degToRad(boneState[key].x),
                            THREE.MathUtils.degToRad(boneState[key].y),
                            THREE.MathUtils.degToRad(boneState[key].z)
                        );
                    }
                });
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
